[project]
name = "radar"
version = "0.1.0"
description = "Radar de operadoras de fondos de inversión para la mesa de capitales"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Solo para sitios 100% JavaScript (descubrir URLs, nunca parsear).
js = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
"radar.core" = ["datos/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
