# Actualización automática del radar.
# Corre en el runner propio de esta PC (etiqueta radar-mx): desde los servidores de GitHub
# (EE. UU.) el sitio de Finaccess y los archivos de la CNBV no responden; con IP mexicana sí.
# Si la PC está apagada a la hora programada, el trabajo espera en la cola hasta 24 h.
#
# Descarga carteras/DICI de las operadoras y R1/R7 de la CNBV, re-parsea, valida (cuadre, ETFs,
# conciliaciones) y genera entregables. Solo hace commit si llegó un documento nuevo o cambió el
# estado de alguna operadora. Streamlit Community Cloud se vuelve a desplegar con cada push.
name: actualizar-radar

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 07:00 CDMX, lunes a viernes
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: [self-hosted, radar-mx]
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false        # conserva data/cache (extracción de PDFs) entre corridas

      - name: Dependencias
        run: python -m pip install -q -r requirements.txt

      - name: Actualizar (fetch de todas + entregables)
        continue-on-error: true
        run: |
          cmd /c "python -m radar actualizar > actualizar.log 2>&1"
          Get-Content actualizar.log -Tail 40

      - name: Estado por operadora
        run: cmd /c "python -m radar estado > data\estado.txt"

      - name: Commit si hay datos nuevos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          $cambios = git status --porcelain data/raw data/estado.txt
          if ($cambios) {
            git add data/raw data/radar.sqlite data/estado.txt salidas
            # Solo ASCII en los pasos de PowerShell: Windows PowerShell 5.1 lee el script temporal
            # del runner como ANSI y rompe los acentos.
            git commit -m "Actualizacion automatica $(Get-Date -Format yyyy-MM-dd)"
            git push
          } else {
            "Sin documentos nuevos ni cambios de estado; no se hace commit (sin cambios)."
          }

      - name: Bitácora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-${{ github.run_id }}
          path: actualizar.log
          retention-days: 30
