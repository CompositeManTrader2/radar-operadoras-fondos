# Actualización automática del radar, en los servidores de GitHub (no depende de ninguna PC).
#
# Descarga R1/R7 de la CNBV, carteras y DICI de las operadoras, re-parsea, valida (cuadre, ETFs,
# conciliaciones) y genera entregables. Solo hace commit si llegó un documento nuevo o cambió el
# estado de alguna operadora (data/estado.txt); cada commit vuelve a desplegar la app de Streamlit.
#
# Notas de red (medido el 2026-11-11 desde un runner de GitHub en EE. UU.):
# - La CNBV no envía su certificado intermedio; va en config/certs y la verificación TLS sigue completa.
# - Finaccess no responde a IPs fuera de México: ese día se usan sus documentos guardados y la
#   cartera de la CNBV (aviso en "Estado de los datos"); las demás fuentes responden normal.
#
# Los PDF de las operadoras híbridas y la caché de extracción no se versionan: viven en la caché
# de Actions entre corridas (si se pierde, se vuelven a bajar solos).
name: actualizar-radar

on:
  schedule:
    - cron: "17 13 * * 1-5"   # 07:17 CDMX, lunes a viernes
    - cron: "17 21 * * 1-5"   # 15:17 CDMX: respaldo (GitHub a veces omite una programación)
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-radar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencias
        run: python -m pip install -q -r requirements.txt

      - name: Restaurar datos no versionados
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/blackrock
            data/raw/sura
            data/raw/principal
            data/raw/franklin
            data/raw/skandia
            data/raw/nafinsa
            data/cache/pdf
            data/cache/revision_dici
          key: radar-datos-sin-coincidencia
          restore-keys: radar-datos-

      - name: Actualizar (fetch de todas + entregables)
        continue-on-error: true
        run: |
          set -o pipefail
          python -m radar actualizar 2>&1 | tee actualizar.log | tail -80

      - name: Estado por operadora
        run: python -m radar estado > data/estado.txt && cat data/estado.txt

      - name: Guardar datos no versionados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/blackrock
            data/raw/sura
            data/raw/principal
            data/raw/franklin
            data/raw/skandia
            data/raw/nafinsa
            data/cache/pdf
            data/cache/revision_dici
          # Una entrada nueva solo cuando cambian las revisiones de DICI o el estado.
          key: radar-datos-${{ hashFiles('data/cache/revision_dici/*', 'data/estado.txt') }}

      - name: Commit si hay datos nuevos
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/raw data/estado.txt)" ]; then
            git add data/raw data/radar.sqlite data/estado.txt salidas
            git commit -q -m "Actualización automática $(date +%F)"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
            echo "Commit y push hechos."
          else
            echo "Sin documentos nuevos ni cambios de estado; no se hace commit."
          fi

      - name: Bitácora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-${{ github.run_id }}
          path: actualizar.log
          retention-days: 30
