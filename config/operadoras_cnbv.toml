# Operadoras cubiertas SOLO con los reportes de la CNBV (R7 cartera mensual, R1 activo neto).
# No tienen adaptador propio todavía: no hay DICI (régimen, comisiones, distribuidoras) ni
# cartera de la operadora; los cortes llegan con ~45 días de rezago.
#
# casa_de_bolsa_hermana: padrón CNBV de casas de bolsa (pes.cnbv.gob.mx, clasificador Aux=18)
# cruzado con el grupo financiero de la operadora. Investigación del 2026-11-10 en
# docs/universo_operadoras.md. Al escribir un adaptador propio, el DICI lo confirma.
#
# Para pasar una operadora a adaptador propio: escribir radar/adapters/<clave>.py, registrarlo
# en radar/adapters/__init__.py y quitarla de aquí.

[defaults]
fuente = "Padrón CNBV de casas de bolsa (Aux=18) y grupos financieros; docs/universo_operadoras.md (2026-11-10)"

